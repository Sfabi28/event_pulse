<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPulse Wall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Animazione per i nuovi messaggi */
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-900 h-screen text-white overflow-hidden flex">

    <div class="w-1/3 bg-slate-800 flex flex-col items-center justify-center border-r border-slate-700 shadow-2xl z-10">
        
        <div class="bg-white p-4 rounded-3xl shadow-lg mb-6">
            <img src="/connect-qr" alt="Scan to Connect" class="w-64 h-64 mix-blend-multiply">
        </div>

        <h1 class="text-3xl font-black text-emerald-400 mb-2">PARTECIPA ORA</h1>
        <p class="text-slate-400 text-lg text-center px-8">
            Scansiona il QR Code col telefono<br>per inviare la tua domanda.
        </p>
    </div>

    <div class="w-2/3 flex flex-col relative">
        
        <div class="p-8 border-b border-slate-800 bg-slate-900/90 backdrop-blur z-10 flex justify-between items-center">
            <h2 class="text-4xl font-black tracking-tight">DOMANDE DAL PUBBLICO</h2>
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
                <span class="text-red-500 font-bold tracking-widest text-sm">LIVE</span>
            </div>
        </div>

        <div id="messagesContainer" class="flex-1 p-8 overflow-y-auto space-y-4 flex flex-col-reverse">
            
            <div class="text-center text-slate-600 mt-20 italic">
                In attesa della prima domanda...
            </div>

        </div>

    </div>

</body>
</html>
